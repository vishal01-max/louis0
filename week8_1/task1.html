
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Personal Website</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #0b1020;
      --card: #151d33;
      --input: #0e1629;
      --purple: #9875ff;
      --cyan: #52d6e8;
      --text: #f3f4ff;
      --muted: #a1abc3;
      --border: #303b57;
      --success: #43d9a3;
      --error: #ff7185;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at 15% 10%, #29205b 0, transparent 35%),
        radial-gradient(circle at 90% 85%, #123c50 0, transparent 35%),
        var(--background);
      color: var(--text);
      min-height: 100vh;
      padding: 45px 20px;
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    .top-label {
      text-align: center;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    h1 {
      text-align: center;
      font-size: clamp(34px, 6vw, 52px);
      margin-bottom: 12px;
      letter-spacing: -1.5px;
    }

    h1 span {
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .intro {
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      max-width: 540px;
      margin: 0 auto 35px;
    }

    .form-card {
      background: rgba(21, 29, 51, 0.95);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .progress-track {
      height: 7px;
      background: #29334b;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 9px;
      color: #e2e7fa;
    }

    .required {
      color: var(--cyan);
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 15px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.25s;
    }

    input::placeholder,
    textarea::placeholder {
      color: #74809c;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(152, 117, 255, 0.15);
    }

    input:valid:not(:placeholder-shown),
    textarea:valid:not(:placeholder-shown),
    select:valid {
      border-color: var(--success);
    }

    input:invalid:not(:placeholder-shown),
    textarea:invalid:not(:placeholder-shown) {
      border-color: var(--error);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .field-note {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
    }

    #charCount.warning {
      color: var(--error);
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .checkbox-row input {
      width: 17px;
      height: 17px;
      margin-top: 2px;
      accent-color: var(--purple);
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 400;
      color: var(--muted);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(100deg, var(--purple), #647cff);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(152, 117, 255, 0.25);
    }

    button:active {
      transform: scale(0.99);
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      background: rgba(67, 217, 163, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 28px;
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 14px;
      }

      .form-card {
        padding: 23px 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .full-width {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="top-label">Let's Connect</div>

    <h1>Get in <span>Touch.</span></h1>

    <p class="intro">
      Have a project, question, or opportunity?
      I'd love to hear from you. Fill out the form below
      and let's start a conversation.
    </p>

    <section class="form-card">

      <div class="progress-info">
        <span>Form completion</span>
        <span id="progressText">0%</span>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <form id="contactForm">

        <div class="form-grid">

          <div class="form-group">
            <label for="name">Full Name <span class="required">*</span></label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              minlength="2"
              maxlength="50"
              pattern="[A-Za-z ]{2,50}"
              title="Enter at least 2 letters. Use letters and spaces only."
              required
            >
          </div>

          <div class="form-group">
            <label for="email">Email Address <span class="required">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              required
            >
          </div>

          <div class="form-group full-width">
            <label for="subject">Subject <span class="required">*</span></label>
            <select id="subject" name="subject" required>
              <option value="">Choose a subject</option>
              <option value="project">Project Collaboration</option>
              <option value="web">Web Development</option>
              <option value="academic">Academic Inquiry</option>
              <option value="general">General Question</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="message">Your Message <span class="required">*</span></label>
            <textarea
              id="message"
              name="message"
              placeholder="Write your message here..."
              minlength="10"
              maxlength="1500"
              required
            ></textarea>

            <div class="field-note">
              <span>Minimum 10 characters</span>
              <span id="charCount">0 / 1500</span>
            </div>
          </div>

        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">
            I confirm that the information provided is correct.
          </label>
        </div>

        <button type="submit">Send Message →</button>

        <div class="message" id="successMessage" role="status" aria-live="polite">
          ✓ Your form has been submitted successfully!
        </div>

      </form>
    </section>

    <footer>
      © 2026 Vishal | Personal Website
    </footer>

  </main>

  <script>
    const form = document.getElementById("contactForm");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const messageInput = document.getElementById("message");
    const charCount = document.getElementById("charCount");
    const successMessage = document.getElementById("successMessage");

    const fields = [
      document.getElementById("name"),
      document.getElementById("email"),
      document.getElementById("subject"),
      document.getElementById("message"),
      document.getElementById("terms")
    ];

    function updateProgress() {
      const completed = fields.filter(field => {
        if (field.type === "checkbox") {
          return field.checked;
        }
        return field.value.trim() !== "" && field.checkValidity();
      }).length;

      const percentage = Math.round((completed / fields.length) * 100);

      progressBar.style.width = percentage + "%";
      progressText.textContent = percentage + "%";
    }

    fields.forEach(field => {
      field.addEventListener("input", updateProgress);
      field.addEventListener("change", updateProgress);
    });

    messageInput.addEventListener("input", () => {
      const length = messageInput.value.length;

      charCount.textContent = length + " / 1500";

      charCount.classList.toggle("warning", length > 1400);
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      successMessage.style.display = "block";

      form.reset();
      updateProgress();
      charCount.textContent = "0 / 1500";
      charCount.classList.remove("warning");

      successMessage.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });

    updateProgress();
  </script>

</body>
</html>

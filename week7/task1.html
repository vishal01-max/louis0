
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1d3557;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        fieldset {
            border: 1px solid #ccd6e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 22px;
        }

        legend {
            font-weight: bold;
            color: #1d3557;
            padding: 0 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input:not([type="checkbox"]):not([type="range"]),
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #8ab4f8;
            border-color: #2563eb;
        }

        /* Invalid and valid input states */
        input:invalid:not(:placeholder-shown) {
            border: 2px solid #dc3545;
            background-color: #fff5f5;
        }

        input:valid:not(:placeholder-shown) {
            border: 2px solid #198754;
            background-color: #f4fff8;
        }

        input[type="date"]:valid,
        input[type="range"]:valid {
            accent-color: #198754;
        }

        select:valid {
            border-color: #198754;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }

        .checkbox-group input {
            width: 17px;
            height: 17px;
        }

        .range-values {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        #experienceValue {
            color: #2563eb;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:active {
            transform: scale(0.99);
        }

        .required {
            color: red;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>
    <p class="description">
        Please complete the form to register as a student.
    </p>

    <form action="#" method="post">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <div class="form-group">
                <label for="fullName">
                    Full Name <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="studentId">
                    Student ID <span class="required">*</span>
                </label>
                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    pattern="\d{9}"
                    placeholder="Enter 9-digit student ID"
                    title="Student ID must contain exactly 9 digits"
                    required
                >
                <p class="hint">Enter exactly 9 digits.</p>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input
                    type="date"
                    id="dob"
                    name="dob"
                >
            </div>

            <div class="form-group">
                <label for="major">Major</label>
                <select id="major" name="major" required>
                    <option value="" disabled selected>
                        Select your major
                    </option>
                    <option value="Computer Engineering">
                        Computer Engineering
                    </option>
                    <option value="Data Science">
                        Data Science
                    </option>
                    <option value="Business Administration">
                        Business Administration
                    </option>
                    <option value="Information Technology">
                        Information Technology
                    </option>
                    <option value="Artificial Intelligence">
                        Artificial Intelligence
                    </option>
                </select>
            </div>

            <!-- Bonus: Coding Experience Slider -->
            <div class="form-group">
                <label for="experience">
                    Years of Coding Experience:
                    <span id="experienceValue">0</span> years
                </label>

                <input
                    type="range"
                    id="experience"
                    name="experience"
                    min="0"
                    max="10"
                    value="0"
                >

                <div class="range-values">
                    <span>0 years</span>
                    <span>10 years</span>
                </div>
            </div>
        </fieldset>

        <!-- Account Information -->
        <fieldset>
            <legend>Account Information</legend>

            <div class="form-group">
                <label for="email">
                    Email <span class="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">
                    Password <span class="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    placeholder="Enter at least 8 characters"
                    required
                >
                <p class="hint">
                    Password must contain at least 8 characters.
                </p>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="text"
                    id="phone"
                    name="phone"
                    pattern="\d{3}-\d{4}-\d{4}"
                    placeholder="010-1234-5678"
                    title="Use the format 010-1234-5678"
                >
                <p class="hint">
                    Format: 010-1234-5678
                </p>
            </div>
        </fieldset>

        <!-- Terms and Conditions -->
        <div class="checkbox-group">
            <input
                type="checkbox"
                id="terms"
                name="terms"
                required
            >
            <label for="terms">
                I agree to the terms <span class="required">*</span>
            </label>
        </div>

        <button type="submit">Register Now</button>

    </form>

    <footer>
        Student Registration Form | Web Programming
    </footer>

</div>

<script>
    const experienceSlider = document.getElementById("experience");
    const experienceValue = document.getElementById("experienceValue");

    experienceSlider.addEventListener("input", function () {
        experienceValue.textContent = experienceSlider.value;
    });
</script>

</body>
</html>

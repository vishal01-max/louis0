
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8faff);
      text-align: center;
      color: #172033;
    }

    main {
      max-width: 560px;
      padding: 52px 28px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 18px 50px #1f375a17;
    }

    h1 {
      font-size: 2rem;
    }

    .code {
      color: #3563e9;
      font-size: 100px;
      font-weight: bold;
      margin: 0;
    }

    p {
      color: #647089;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 30px;
      background: #3563e9;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      background: #244bc0;
    }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>Oops! Page not found.</h1>
    <p>Looks like this page has wandered off. No worries — let's get you back on track.</p>
    <a href="https://vishal01-max.github.io/webpro-w9/">← Back to Home</a>
  </main>
</body>
</html>

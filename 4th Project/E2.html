<!DOCTYPE html>
<html>
<head>
  <title>Hover Card</title>
  <style>
    .card {
      width: 280px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 8px #aaa;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px teal;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>My Card</h2>
    <p>Move your mouse over me.</p>
  </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Loading</title>
  <style>
    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid #99dddd;
      border-top-color: #008080;
      border-radius: 50%;
      animation: rotate 1s linear infinite;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loader"></div>

</body>
</html>

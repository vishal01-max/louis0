<!DOCTYPE html>
<html>
<head>
    <title>Box Model Visualization</title>

    <style>
        .margin {
            background-color: #f59e0b;
            width: 400px;
            height: 300px;
            margin: 50px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .border {
            background-color: #475569;
            width: 320px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .padding {
            background-color: #38bdf8;
            width: 240px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            background-color: #7c3aed;
            width: 140px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="margin">
        Margin

        <div class="border">
            Border

            <div class="padding">
                Padding

                <div class="content">
                    Content
                </div>

            </div>
        </div>
    </div>

</body>
</html>

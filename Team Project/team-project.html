<body>
	
  <!-- Auth View -->

<!-- Main App View -->
<div class="app-view view" id="main-app-view">
  <div class="header">
    <div class="title-group">
      <button id="profile-btn" class="icon-btn" style="padding:0;" data-toggle="modal" data-target="#profileUploadModal">

      </button>
      <h3>Chats</h3>
    </div>
    <div class="actions">
      <button id="search-btn" class="icon-btn" title="Search Users"><i class="fas fa-search"></i></button>
      <button id="add-note-btn" class="icon-btn" title="Add Note"><i class="fas fa-sticky-note"></i></button>
      <button id="see-notes-btn" class="icon-btn" title="See Notes"><i class="fas fa-eye"></i></button>
    </div>
    <div class="dropdown-menu hidden" id="main-menu">
      <button id="menu-new-group-btn"><i class="fas fa-users"></i> New Group</button>
    </div>
  </div>

  <div style="padding: 1rem;">
    <button id="add-friends-btn" class="btn">Add Friends</button>
    <button id="logout-btn" class="btn" style="background: crimson; margin-top: 4px;">Logout</button>
  </div>

  <div class="list-container" id="chat-list"></div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav-chats"><i class="fas fa-comment"></i><span>Chats</span></div>
    <div class="nav-item" id="nav-people"><i class="fas fa-users"></i><span>People</span></div>

</div>

<!-- Profile Upload Modal -->

      <div class="modal-header">
        <h5 class="modal-title">Upload Profile Picture</h5>

        <input type="file" id="profileImageInput" accept="image/*" class="form-control">

</div>

<!-- Create Group Modal -->
<div class="modal fade" id="createGroupModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Group</h5>
        <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
      </div>
      <div class="modal-body">
        <input type="text" id="groupNameInput" class="form-control" placeholder="Group Name" />
        <div id="groupFriendsList" style="margin-top:1rem;"></div>

</div>

<!-- Chat Window -->

  <div class="header">
    <button id="back-btn" class="back-btn">
      <i class="fas fa-arrow-left"></i>

  <div class="chat-messages" id="chat-messages"></div>
  
  <div class="chat-input">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAptYoMpfPfRhUoRtawjSHXCq53IF2fymo",
    authDomain: "fir-chat-e96ca.firebaseapp.com",
    databaseURL: "https://fir-chat-e96ca-default-rtdb.firebaseio.com",
    projectId: "fir-chat-e96ca",
    storageBucket: "fir-chat-e96ca.appspot.com",
    messagingSenderId: "457621605156",
    appId: "1:457621605156:web:f04ee7127d2a113a6b81b1"
  };

  const app = {
    currentUser: null,
    allUsers: {},
    listeners: {},
    currentChatId: null,

    init() {
      firebase.initializeApp(firebaseConfig);
      this.auth = firebase.auth();
      this.db = firebase.database();
      this.attachAuthListeners();
      this.auth.onAuthStateChanged(this.authStateObserver.bind(this));
    },

    attachAuthListeners() {
      document.getElementById('show-signup').onclick = () => {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('signup-box').classList.remove('hidden');
      };
      document.getElementById('show-login').onclick = () => {
        document.getElementById('signup-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
      };
      document.getElementById('login-btn').onclick = this.login.bind(this);
      document.getElementById('signup-btn').onclick = this.signUp.bind(this);
    },

    attachMainAppListeners() {
  this.clearMainAppListeners();

  const handlers = {
    'send-btn': this.sendMessage.bind(this),
    'back-btn': this.backToChatList.bind(this),
    'nav-people': this.showCreateGroup.bind(this),
    'nav-menu': this.showUserProfile.bind(this),
    'nav-chats': () => this.renderChatList(),
    'add-note-btn': this.addNote.bind(this),
    'see-notes-btn': this.seeNotes.bind(this),
    'search-btn': this.searchUsers.bind(this),
    'add-friends-btn': this.showAddFriends.bind(this),
    'logout-btn': () => this.auth.signOut(),
    'video-call-btn': () => {
      if (!this.currentChatId) return;
      const targetUid = this.currentChatId
        .replace(`${this.currentUser.uid}_`, '')
        .replace(`_${this.currentUser.uid}`, '');
      startCall(targetUid);
      console.log("Attaching main app listeners");
    },
    'menu-new-group-btn': this.showCreateGroup.bind(this)
  };

  this.mainListeners = {};
  for (const id in handlers) {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('click', handlers[id]);
      this.mainListeners[id] = { el, handler: handlers[id] };
    }
  }

  // ✅ Add missing create group button logic
  const confirmBtn = document.getElementById("createGroupBtn");
  if (confirmBtn) {
    confirmBtn.addEventListener("click", async () => {
      console.log("Create Group button clicked");

      const groupName = document.getElementById("group-name").value.trim();
      const selectedUserIds = Array.from(document.querySelectorAll('.friend-checkbox:checked')).map(cb => cb.value);

      if (!groupName) {
        alert("Please enter a group name.");
        return;
      }

      if (selectedUserIds.length === 0) {
        alert("Please select at least one friend to add to the group.");
        return;
      }

      await app.createGroup(groupName, selectedUserIds);

      // Hide modal and reset inputs
      $('#createGroupModal').modal('hide');
      document.getElementById("group-name").value = "";
    });
  }
},

clearMainAppListeners() {
  if (!this.mainListeners) return;
  for (const key in this.mainListeners) {
    const { el, handler } = this.mainListeners[key];
    el.removeEventListener('click', handler);
  }
  this.mainListeners = null;
},

async authStateObserver(user) {
  this.clearListeners();
  if (user) {
    this.currentUser = user;
    document.getElementById('loader').style.display = 'flex';
    try {
      await this.loadInitialData();
      this.attachMainAppListeners();
      this.navigateTo('main-app-view');
      await this.renderChatList();
    } catch (error) {
      console.error("Startup Error:", error);
      this.auth.signOut();
    } finally {
      document.getElementById('loader').style.display = 'none';
    }
  } else {
    this.currentUser = null;
    this.navigateTo('auth-container');
  }
},

navigateTo(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId)?.classList.add('active');
},

    async login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (!email || !password) return alert("Please enter both email and password.");
      document.getElementById('loader').style.display = 'flex';
      try {
        await this.auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        alert(error.message);
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    },
    
    async signUp() {
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const psw = document.getElementById('signup-password').value.trim();
      if (!name || !email || !psw) return alert("Please fill in all fields.");
      document.getElementById('loader').style.display = 'flex';
      try {
        const cred = await this.auth.createUserWithEmailAndPassword(email, psw);
        await this.db.ref(`users/${cred.user.uid}`).set({ name, email });
        alert('Sign up successful! Please log in.');
        document.getElementById('signup-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
      } catch (error) {
        alert(error.message);
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    },

    async loadInitialData() {
      const usersSnap = await this.db.ref('users').once('value');
      this.allUsers = usersSnap.val() || {};
      const user = this.allUsers[this.currentUser.uid];
      const avatar = document.getElementById('header-avatar');
      if (user) {
        avatar.style.backgroundImage = user.profileImageUrl ? `url(${user.profileImageUrl})` : '';
        avatar.textContent = user.profileImageUrl ? '' : user.name.charAt(0).toUpperCase();
      }
    },

    async renderChatList() {
  const listEl = document.getElementById('chat-list');
  listEl.innerHTML = '';

  // Load friend-based chats
  const friendIds = (await this.db.ref(`users/${this.currentUser.uid}/friends`).once('value')).val() || {};
  Object.entries(this.allUsers).forEach(([uid, user]) => {
    if (uid !== this.currentUser.uid && friendIds[uid]) {
      const chatId = [this.currentUser.uid, uid].sort().join('_');
      const lastMessageRef = this.db.ref(`chats/${chatId}/lastMessage`);
      lastMessageRef.once('value').then(snap => {
        const lastMsg = snap.exists() ? snap.val().text : `Start a chat with ${user.name}`;
        const el = this.createChatItem(user.name, user.profileImageUrl, lastMsg, chatId);
        el.onclick = () => this.openChatWithUser(uid, user.name);
        listEl.appendChild(el);
      });
    }
  });

  // ✅ Load group chats
  const groupsSnap = await this.db.ref('groups').once('value');
  const groups = groupsSnap.val() || {};

  Object.entries(groups).forEach(([groupId, group]) => {
    if (group.members && group.members[this.currentUser.uid]) {
      const lastMessageRef = this.db.ref(`chats/${groupId}/lastMessage`);
      lastMessageRef.once('value').then(snap => {
        const lastMsg = snap.exists() ? snap.val().text : `Start chatting in ${group.name}`;
        const el = this.createChatItem(`[Group] ${group.name}`, null, lastMsg, groupId);
        el.onclick = () => this.initiateChat(groupId, group.name);
        listEl.appendChild(el);
      });
    }
  });
},

createChatItem(name, avatarUrl, lastMsg, chatId) {
  const div = document.createElement('div');
  div.className = 'list-item';
  div.innerHTML = `
    <div class="avatar" style="background-image: url(${avatarUrl || ''})">
      ${!avatarUrl ? name.charAt(0).toUpperCase() : ''}
    </div>
    <div class="chat-info">
      <div class="chat-info-main">
        <strong>${name}</strong>
        <small>${lastMsg}</small>
      </div>
    </div>`;
  div.onclick = () => this.initiateChat(chatId, name);
  return div;
},

openChatWithUser(userId, userName) {
  const roomId = [this.currentUser.uid, userId].sort().join('_');
  this.db.ref(`chats/${roomId}/participants`).update({
    [this.currentUser.uid]: true,
    [userId]: true
  }).then(() => this.initiateChat(roomId, userName));
},

initiateChat(chatId, name) {
  this.currentChatId = chatId;
  document.getElementById('chat-title').textContent = name;
  this.navigateTo('chat-window');

  // ✅ Only listen for calls if it's a direct 1-on-1 chat
  if (!chatId.startsWith('group_') && chatId.includes(this.currentUser.uid)) {
    const targetUid = chatId
      .replace(`${this.currentUser.uid}_`, '')
      .replace(`_${this.currentUser.uid}`, '');
    listenForCall(targetUid);
  }

  this.loadMessages();
},
loadMessages() {
  this.clearListener('messages');
  const messagesEl = document.getElementById('chat-messages');
  messagesEl.innerHTML = '';

  const messagesRef = this.db.ref(`chats/${this.currentChatId}/messages`).orderByChild('timestamp');
  const callback = messagesRef.on('child_added', snap => {
    const msg = snap.val();
    const sender = this.allUsers[msg.senderId];
    const senderName = sender ? sender.name : 'Unknown';

    const isSelf = msg.senderId === this.currentUser.uid;
    const el = document.createElement('div');
    el.className = `message ${isSelf ? 'sent' : 'received'}`;

    el.innerHTML = `
      <div class="bubble">
        ${!isSelf ? `<strong style="font-size: 0.85rem; color: #333;">${senderName}</strong><br>` : ''}
        ${msg.text}
      </div>
    `;

    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });

  this.listeners.messages = { ref: messagesRef, type: 'child_added', callback };
}, 

    sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !this.currentChatId) return;

      const messageData = {
        text,
        senderId: this.currentUser.uid,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      const chatRef = this.db.ref(`chats/${this.currentChatId}`);
      chatRef.child('messages').push(messageData);
      chatRef.child('lastMessage').set({
        ...messageData,
        readBy: { [this.currentUser.uid]: true }
      });

      input.value = '';
    },

    backToChatList() {
      this.clearListener('messages');
      this.navigateTo('main-app-view');
      this.currentChatId = null;
    },

    async showCreateGroup() {
      // Prepare modal
      console.log("Show Create Group triggered");
      const friendsSnap = await this.db.ref(`users/${this.currentUser.uid}/friends`).once('value');
      const friends = friendsSnap.val() || {};
      const container = document.getElementById('groupFriendsList');
      container.innerHTML = '';

      Object.entries(friends).forEach(([uid]) => {
        const user = this.allUsers[uid];
        const div = document.createElement('div');
        div.innerHTML = `<label><input type="checkbox" value="${uid}"> ${user.name}</label>`;
        container.appendChild(div);
      });

      // Show modal
      $('#createGroupModal').modal('show');
    },

    showUserProfile() {
      const user = this.allUsers[this.currentUser.uid];
      const newPic = prompt("Enter image URL to update profile picture:", user.profileImageUrl || "");
      if (newPic) {
        this.db.ref(`users/${this.currentUser.uid}`).update({ profileImageUrl: newPic });
        alert("Profile updated.");
      }
    },

    searchUsers() {
      const term = prompt("Search users by name:");
      if (!term) return;

      const listEl = document.getElementById('chat-list');
      listEl.innerHTML = '';

      Object.entries(this.allUsers).forEach(([uid, user]) => {
        if (uid !== this.currentUser.uid && user.name.toLowerCase().includes(term.toLowerCase())) {
          const el = this.createChatItem(user.name, user.profileImageUrl, `Start a chat with ${user.name}`, uid);
          el.onclick = () => this.openChatWithUser(uid, user.name);
          listEl.appendChild(el);
        }
      });
    },

    async addNote() {
      const content = prompt("Enter your public note (disappears in 24h):");
      if (!content) return;

      const timestamp = Date.now();
      const expiresAt = timestamp + 24 * 60 * 60 * 1000;

      const note = {
        text: content,
        userId: this.currentUser.uid,
        timestamp,
        expiresAt
      };

      await this.db.ref('public_notes').push(note);
      alert("Note added!");
    },

    async seeNotes() {
      const now = Date.now();
      const notesSnap = await this.db.ref('public_notes').once('value');
      const usersSnap = await this.db.ref('users').once('value');
      const allUsers = usersSnap.val() || {};
      const notes = [];

      notesSnap.forEach(snap => {
        const note = snap.val();
        if (note.expiresAt > now) {
          const user = allUsers[note.userId];
          const name = user?.name || 'Unknown';
          notes.push(`${name}: ${note.text}`);
        }
      });

      alert(notes.length ? notes.join('\n\n') : 'No active public notes.');
    },

    async showAddFriends() {
      const friendRef = this.db.ref(`users/${this.currentUser.uid}/friends`);
      const currentFriends = (await friendRef.once('value')).val() || {};
      const container = document.getElementById('users-to-add');
      container.innerHTML = '';

      Object.entries(this.allUsers).forEach(([uid, user]) => {
        if (uid !== this.currentUser.uid && !currentFriends[uid]) {
          const div = document.createElement('div');
          div.style.display = 'flex';
          div.style.alignItems = 'center';
          div.style.justifyContent = 'space-between';
          div.style.borderBottom = '1px solid #eee';
          div.style.paddingBottom = '0.5rem';

          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:0.75rem;">
              <div class="avatar" style="width:40px;height:40px;background-image:url(${user.profileImageUrl || ''})">
                ${!user.profileImageUrl ? user.name.charAt(0).toUpperCase() : ''}
              </div>
              <span>${user.name}</span>
            </div>
            <button class="btn" style="width:auto;padding:0.4rem 1rem;" data-uid="${uid}">Add</button>
          `;

          container.appendChild(div);
        }
      });

      document.querySelectorAll('#users-to-add .btn').forEach(btn => {
        btn.onclick = async () => {
          const uid = btn.getAttribute('data-uid');
          try {
            await this.db.ref(`users/${this.currentUser.uid}/friends/${uid}`).set(true);
            await this.db.ref(`users/${uid}/friends/${this.currentUser.uid}`).set(true);

            const chatId = [this.currentUser.uid, uid].sort().join('_');
            await this.db.ref(`chats/${chatId}/participants`).update({
              [this.currentUser.uid]: true,
              [uid]: true
            });

            await this.db.ref(`chats/${chatId}/lastMessage`).set({
              text: `Say hi to ${this.allUsers[uid].name}!`,
              senderId: this.currentUser.uid,
              timestamp: firebase.database.ServerValue.TIMESTAMP,
              readBy: { [this.currentUser.uid]: true }
            });

            btn.textContent = 'Added';
            btn.disabled = true;
            btn.style.background = 'gray';

            await this.renderChatList();
          } catch (err) {
            console.error("Failed to add friend:", err);
            alert("Failed to add friend. Check your internet or permissions.");
          }
        };
      });

      document.getElementById('add-friends-modal').style.display = 'flex';
    }, // ✅ This comma was missing

    clearListener(key) {
      if (this.listeners[key]) {
        this.listeners[key].ref.off(this.listeners[key].type, this.listeners[key].callback);
        delete this.listeners[key];
      }
    },

    clearListeners() {
      for (const key in this.listeners) {
        this.listeners[key].ref.off(this.listeners[key].type, this.listeners[key].callback);
      }
      this.listeners = {};
    }
  };

  app.init();
</script>

<!-- Add this inside your <body> before the closing </body> tag --><!-- Video Call Modal --><div id="video-call-modal" class="loader-overlay" style="display: none; background: rgba(0,0,0,0.8);">
  <div style="background:#000; border-radius:8px; max-width:95vw; width:100%; height:95vh; position:relative;">
    <video id="remoteVideo" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
    <video id="localVideo" autoplay muted playsinline style="position:absolute; bottom:1rem; right:1rem; width:120px; height:100px; border-radius:8px; border:2px solid white;"></video>
    <button onclick="endCall()" style="position:absolute; top:10px; right:10px; background:red; color:#fff; border:none; padding:0.5rem 1rem; border-radius:6px; cursor:pointer;">End</button>
  </div>
</div><script>
// WebRTC Basic Video Call (One-on-One) with Firebase Realtime DB Signaling
let localStream, peerConnection;
const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

// Firebase signaling
const callsRef = firebase.database().ref('videoCalls');

async function startCall(targetUid) {
  const callId = [app.currentUser.uid, targetUid].sort().join('_');
  const callRef = callsRef.child(callId);

  document.getElementById('video-call-modal').style.display = 'flex';
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  localVideo.srcObject = localStream;

  peerConnection = new RTCPeerConnection(servers);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  peerConnection.ontrack = event => {
    remoteVideo.srcObject = event.streams[0];
  };
  peerConnection.onicecandidate = e => {
    if (e.candidate) callRef.child('candidates/' + app.currentUser.uid).push(e.candidate.toJSON());
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  await callRef.child('offers/' + app.currentUser.uid).set(offer);

  callRef.child('answers/' + targetUid).on('value', async snap => {
    const answer = snap.val();
    if (answer && !peerConnection.currentRemoteDescription) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
    }
  });

  callRef.child('candidates/' + targetUid).on('child_added', snap => {
    const candidate = new RTCIceCandidate(snap.val());
    peerConnection.addIceCandidate(candidate);
  });
}

function listenForCall(targetUid) {
  const callId = [app.currentUser.uid, targetUid].sort().join('_');
  const callRef = callsRef.child(callId);

  callRef.child('offers/' + targetUid).on('value', async snap => {
    const offer = snap.val();
    if (offer) {
      document.getElementById('video-call-modal').style.display = 'flex';
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;

      peerConnection = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      peerConnection.ontrack = event => {
        remoteVideo.srcObject = event.streams[0];
      };
      peerConnection.onicecandidate = e => {
        if (e.candidate) callRef.child('candidates/' + app.currentUser.uid).push(e.candidate.toJSON());
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      await callRef.child('answers/' + app.currentUser.uid).set(answer);

      callRef.child('candidates/' + targetUid).on('child_added', snap => {
        const candidate = new RTCIceCandidate(snap.val());
        peerConnection.addIceCandidate(candidate);
      });
    }
  });
}

function endCall() {
  if (peerConnection) peerConnection.close();
  document.getElementById('video-call-modal').style.display = 'none';
  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
}
</script>

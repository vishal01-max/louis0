
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f1f5f9;
    padding: 40px 20px;
    margin: 0;
  }

  .container {
    max-width: 380px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  }

  h2 {
    text-align: center;
    color: #1e293b;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 25px;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 7px;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 14px;
    margin-bottom: 14px;
  }

  input:focus-visible {
    outline: 3px solid #93c5fd;
    border-color: #2563eb;
  }

  .error {
    color: #b91c1c;
    background: #fee2e2;
    padding: 9px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 12px;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 7px;
  }

  .icon-btn {
    background: #2563eb;
    color: white;
    width: 38px;
    height: 38px;
    font-size: 18px;
    display: block;
    margin: 0 auto 20px;
  }

  .submit-btn {
    background: #2563eb;
    color: white;
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 8px;
  }

  .submit-btn:hover {
    background: #1d4ed8;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid #f59e0b;
    outline-offset: 3px;
  }

  .footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-top: 20px;
  }

  .footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>

<body>

<div class="container">

  <h2>Create Account</h2>
  <p class="subtitle">Welcome! Please sign up to continue.</p>

  <!-- Fix 1: accessible icon button -->
  <button class="icon-btn" type="button" aria-label="Search">
    🔍
  </button>

  <!-- Fix 2: proper input label -->
  <label for="email-field">Email address</label>
  <input
    type="email"
    id="email-field"
    placeholder="you@example.com"
  >

  <!-- Fix 3: error has text and icon -->
  <div class="error" role="alert">
    ⚠️ Error: Please enter a valid email address.
  </div>

  <label for="password-field">Password</label>
  <input
    type="password"
    id="password-field"
    placeholder="At least 8 characters"
  >

  <div class="error" role="alert">
    ⚠️ Error: Password must be at least 8 characters.
  </div>

  <button class="submit-btn" type="button"
    onclick="alert('Sign up button clicked!')">
    Create Account
  </button>

  <!-- Fix 4: descriptive linked image alt -->
  <div class="footer">
    <a href="/about">
      <img src="" alt="Learn about our team"
        style="width:80px;height:35px;display:block;margin:15px auto">
    </a>
    Already have an account? <a href="/login">Log in</a>
  </div>

</div>

</body>
</html>

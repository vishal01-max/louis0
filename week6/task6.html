
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>World Countries Explorer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 30px 15px;
      color: #243047;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #1d3b70;
      font-size: 32px;
    }

    .description {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      max-width: 750px;
      margin: 25px auto;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 14px 22px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      text-align: center;
      margin: 25px;
      font-weight: bold;
    }

    .country-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .country-card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .country-card h2 {
      text-align: center;
      color: #1d3b70;
    }

    .flag {
      display: block;
      width: 160px;
      height: 100px;
      object-fit: contain;
      margin: 15px auto;
    }

    .flag-emoji {
      display: block;
      text-align: center;
      font-size: 55px;
      margin: 15px;
    }

    .country-card p {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .country-card strong {
      color: #1d3b70;
    }

    .map-link {
      display: inline-block;
      margin-top: 15px;
      color: #2563eb;
      text-decoration: none;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .count {
      text-align: center;
      color: #64748b;
      margin-top: 15px;
    }

    @media (max-width: 500px) {
      .search-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🌍 World Countries Explorer</h1>

    <p class="description">
      Explore country information from around the world.
      Search any country to get detailed information.
    </p>

    <div class="search-box">

      <input
        type="text"
        id="countryInput"
        list="countryList"
        placeholder="Search any country (e.g. Nepal, Japan, Brazil)"
        aria-label="Search countries"
      >

      <datalist id="countryList"></datalist>

      <button id="searchBtn">
        Search Country
      </button>

      <button id="allBtn">
        Show All Countries
      </button>

    </div>

    <p id="status" role="status" aria-live="polite">
      Loading all countries...
    </p>

    <p id="count" class="count"></p>

    <section
      id="countryResults"
      class="country-grid"
      aria-label="Country results"
    ></section>

  </main>

  <script>

    const input = document.getElementById("countryInput");
    const button = document.getElementById("searchBtn");
    const allButton = document.getElementById("allBtn");
    const status = document.getElementById("status");
    const count = document.getElementById("count");
    const results = document.getElementById("countryResults");
    const countryList = document.getElementById("countryList");

    // Store all country information
    let allCountries = [];

    // Load the complete country database
    async function loadCountries() {

      try {

        status.textContent = "Loading world country database...";

        const url =
          "https://countries.dev/countries?fields=name,nativeName,alpha2Code,alpha3Code,capital,region,subregion,population,area,latlng,timezones,borders,currencies,languages,flag,flags,maps";

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Unable to load country database.");
        }

        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("Country database is empty.");
        }

        allCountries = data;

        // Sort countries alphabetically
        allCountries.sort((a, b) =>
          a.name.localeCompare(b.name)
        );

        // Populate searchable country suggestions
        allCountries.forEach(country => {

          const option = document.createElement("option");

          option.value = country.name;

          countryList.appendChild(option);

        });

        status.textContent =
          "Country database loaded successfully!";

        count.textContent =
          `Available countries and territories: ${allCountries.length}`;

        // Automatically display Nepal
        input.value = "Nepal";

        searchCountry();

      } catch (error) {

        status.textContent = error.message;

        console.error("Loading Error:", error);

      }

    }

    // Search any country from the complete database
    function searchCountry() {

      const query = input.value.trim().toLowerCase();

      if (!query) {
        status.textContent = "Please enter a country name.";
        results.replaceChildren();
        count.textContent = "";
        return;
      }

      // Exact match first
      const exactMatches = allCountries.filter(country =>
        country.name.toLowerCase() === query ||
        country.nativeName?.toLowerCase() === query ||
        country.alpha2Code?.toLowerCase() === query ||
        country.alpha3Code?.toLowerCase() === query
      );

      // Otherwise search partial country names
      const matches = exactMatches.length > 0
        ? exactMatches
        : allCountries.filter(country =>
            country.name.toLowerCase().includes(query) ||
            country.nativeName?.toLowerCase().includes(query)
          );

      results.replaceChildren();

      if (matches.length === 0) {

        status.textContent =
          "No country found. Please check your spelling.";

        count.textContent = "";
        return;

      }

      status.textContent =
        "Country information loaded successfully!";

      count.textContent =
        `Found ${matches.length} matching country/countries.`;

      matches.forEach(country => {

        const card = document.createElement("article");

        card.className = "country-card";

        // Country heading
        const heading = document.createElement("h2");

        heading.textContent =
          `${country.flag || ""} ${country.name}`;

        card.appendChild(heading);

        // Country flag
        const flagURL =
          country.flags?.svg ||
          country.flags?.png ||
          (typeof country.flag === "string" &&
           country.flag.startsWith("http")
            ? country.flag
            : "");

        if (flagURL) {

          const image = document.createElement("img");

          image.src = flagURL;
          image.alt = `${country.name} flag`;
          image.className = "flag";
          image.loading = "lazy";

          image.onerror = () => image.remove();

          card.appendChild(image);

        } else if (country.flag) {

          const emoji = document.createElement("span");

          emoji.className = "flag-emoji";
          emoji.textContent = country.flag;

          card.appendChild(emoji);

        }

        // Format currency
        const currencies =
          country.currencies?.map(currency =>
            `${currency.name} (${currency.code}) ${currency.symbol || ""}`
          ).join(", ");

        // Format languages
        const languages =
          country.languages?.map(language =>
            language.name
          ).join(", ");

        // Format country details
        const details = [

          ["Official / Native Name", country.nativeName],
          ["Capital", country.capital],
          ["Population",
            country.population?.toLocaleString("en-US")],
          ["Region", country.region],
          ["Subregion", country.subregion],
          ["Area",
            country.area?.toLocaleString("en-US") + " km²"],
          ["Currency", currencies],
          ["Languages", languages],
          ["Country Code", country.alpha2Code],
          ["International Code", country.alpha3Code],
          ["Calling Code", country.callingCodes?.join(", ")],
          ["Time Zones", country.timezones?.join(", ")],
          ["Bordering Countries", country.borders?.join(", ")]

        ];

        details.forEach(([label, value]) => {

          if (
            value === undefined ||
            value === null ||
            value === ""
          ) {
            return;
          }

          const paragraph = document.createElement("p");

          const strong = document.createElement("strong");

          strong.textContent = label + ": ";

          paragraph.appendChild(strong);

          paragraph.appendChild(
            document.createTextNode(String(value))
          );

          card.appendChild(paragraph);

        });

        // Google Maps link
        if (country.maps?.googleMaps) {

          const mapLink = document.createElement("a");

          mapLink.href = country.maps.googleMaps;
          mapLink.target = "_blank";
          mapLink.rel = "noopener noreferrer";
          mapLink.className = "map-link";

          mapLink.textContent = "View on Google Maps";

          card.appendChild(mapLink);

        }

        results.appendChild(card);

      });

    }

    // Search button
    button.addEventListener("click", searchCountry);

    // Enter key search
    input.addEventListener("keydown", event => {

      if (event.key === "Enter") {
        searchCountry();
      }

    });

    // Display every country
    allButton.addEventListener("click", () => {

      input.value = "";

      results.replaceChildren();

      status.textContent =
        "Showing the complete country database.";

      count.textContent =
        `Total countries and territories: ${allCountries.length}`;

      allCountries.forEach(country => {

        const card = document.createElement("article");
        card.className = "country-card";

        const heading = document.createElement("h2");

        heading.textContent =
          `${country.flag || ""} ${country.name}`;

        card.appendChild(heading);

        const capital = document.createElement("p");

        capital.textContent =
          `Capital: ${country.capital || "Not listed"}`;

        card.appendChild(capital);

        const region = document.createElement("p");

        region.textContent =
          `Region: ${country.region || "Not listed"}`;

        card.appendChild(region);

        const population = document.createElement("p");

        population.textContent =
          `Population: ${
            country.population?.toLocaleString("en-US") ||
            "Not listed"
          }`;

        card.appendChild(population);

        const link = document.createElement("button");

        link.textContent = "View Full Information";

        link.addEventListener("click", () => {

          input.value = country.name;

          searchCountry();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        });

        card.appendChild(link);

        results.appendChild(card);

      });

    });

    // Start application
    loadCountries();

  </script>

</body>
</html>

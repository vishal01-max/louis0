
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f7fb;
      padding: 30px;
    }

    .container {
      background: white;
      padding: 25px;
      max-width: 400px;
      margin: auto;
      border-radius: 12px;
    }

    img {
      width: 120px;
      border-radius: 50%;
    }

    button {
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Random User Profile</h2>
    <div id="user">Click the button to load a user.</div>
    <button onclick="getUser()">Generate User</button>
  </div>

  <script>
    function getUser() {
      fetch("https://randomuser.me/api/")
        .then(response => response.json())
        .then(data => {
          const user = data.results[0];

          document.getElementById("user").innerHTML = `
            <img src="${user.picture.large}" alt="User photo">
            <h3>${user.name.first} ${user.name.last}</h3>
            <p>Gender: ${user.gender}</p>
            <p>Email: ${user.email}</p>
            <p>Country: ${user.location.country}</p>
          `;
        })
        .catch(error => {
          document.getElementById("user").textContent = "Error loading user.";
          console.error(error);
        });
    }

    getUser();
  </script>

</body>
</html>

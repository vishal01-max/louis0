<!DOCTYPE html>
<html>
<head>
    <title>Colour Swatches</title>

    <style>
        .swatches {
            display: flex;
            gap: 12px;
        }

        .swatch {
            padding: 30px 20px;
            color: white;
            font-weight: bold;
            border-radius: 8px;
        }

        .purple {
            background-color: #7c3aed;
        }

        .blue {
            background-color: #0369a1;
        }

        .green {
            background-color: #16a34a;
        }

        .red {
            background-color: #dc2626;
        }

        .orange {
            background-color: #ea580c;
        }
    </style>
</head>

<body>

    <div class="swatches">
        <div class="swatch purple">#7c3aed</div>
        <div class="swatch blue">#0369a1</div>
        <div class="swatch green">#16a34a</div>
        <div class="swatch red">#dc2626</div>
        <div class="swatch orange">#ea580c</div>
    </div>

</body>
</html>

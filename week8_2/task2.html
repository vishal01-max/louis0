
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 06 | Grouping Form Fields</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px 16px;
      max-width: 580px;
      margin: auto;
      color: #263445;
      background: #eef2f7;
    }

    main {
      background: #ffffff;
      padding: 32px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(30, 50, 80, 0.09);
    }

    h1 {
      color: #6246a5;
      margin-top: 0;
      font-size: 25px;
    }

    p {
      line-height: 1.6;
      color: #526174;
    }

    fieldset {
      border: 2px solid #d8ccef;
      border-radius: 12px;
      padding: 15px 18px 20px;
      margin-bottom: 22px;
    }

    legend {
      font-weight: bold;
      color: #6246a5;
      padding: 0 10px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin: 12px 0 7px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 2px solid #d4dce8;
      border-radius: 7px;
      font-size: 15px;
      background: #fff;
      outline: none;
      transition: 0.25s;
    }

    input:focus, select:focus {
      border-color: #6246a5;
      box-shadow: 0 0 0 3px rgba(98, 70, 165, 0.15);
    }

    .back {
      display: inline-block;
      margin-top: 8px;
      color: #6246a5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main>
    <h1>Topic 06: Grouping Form Fields</h1>

    <p>
      The <code>&lt;fieldset&gt;</code> element groups related form
      controls into sections, while <code>&lt;legend&gt;</code>
      provides a meaningful title for each section.
    </p>

    <form>
      <!-- Personal Details -->
      <fieldset>
        <legend>Personal Details</legend>

        <label for="fname">Full Name</label>
        <input
          type="text"
          id="fname"
          placeholder="Enter your full name"
        >

        <label for="dept">Academic Major</label>
        <select id="dept">
          <option>Computer Science</option>
          <option>Software Engineering</option>
          <option>Artificial Intelligence</option>
        </select>
      </fieldset>

      <!-- Contact Details -->
      <fieldset>
        <legend>Contact Details</legend>

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="name@gachon.ac.kr"
        >
      </fieldset>
    </form>

    <a class="back" href="index.html">← Back to Index</a>
  </main>
</body>
</html>

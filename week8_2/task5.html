
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 05 | Labels & Accessibility</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      color: #263449;
      padding: 35px 16px;
      max-width: 560px;
      margin: auto;
    }

    main {
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      border-top: 5px solid #7c3aed;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
    }

    h1 {
      color: #7c3aed;
      margin-top: 0;
      font-size: 24px;
    }

    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    code {
      background: #f3e8ff;
      color: #6b21a8;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .box {
      background: #faf8ff;
      border: 1px solid #ddd6fe;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 17px;
    }

    .box-title {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
    }

    label {
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }

    .text-input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      margin-top: 8px;
      font-size: 14px;
    }

    .text-input:focus {
      outline: none;
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #7c3aed;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: #7c3aed;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      main {
        padding: 22px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Topic 05: Labels & Accessibility</h1>

    <p>
      HTML labels improve accessibility by connecting text with form controls.
      They help screen readers identify inputs and make forms easier to use.
    </p>

    <!-- Method 1: Explicit linking -->
    <div class="box">
      <span class="box-title">
        Method 1: Explicit <code>for</code> and <code>id</code> linking
      </span>

      <label for="explicit-input">Your Full Name</label>
      <input
        class="text-input"
        type="text"
        id="explicit-input"
        placeholder="Click the label to focus this input"
      >
    </div>

    <!-- Method 2: Implicit wrapping -->
    <div class="box">
      <span class="box-title">
        Method 2: Implicit label wrapping
      </span>

      <div class="input-row">
        <label>
          <input type="checkbox" id="newsletter">
          Subscribe to the newsletter
        </label>
      </div>
    </div>

    <a class="back" href="index.html">← Back to Index</a>
  </main>
</body>
</html>

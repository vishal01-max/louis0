
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 04 | HTML5 Form Validation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 40px 16px;
      background: linear-gradient(135deg, #e0e7ff, #fce7f3);
      color: #334155;
    }

    main {
      max-width: 560px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(51, 65, 85, 0.12);
    }

    .tag {
      display: inline-block;
      background: #ede9fe;
      color: #6d28d9;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h1 {
      color: #4f46e5;
      margin: 0 0 10px;
      font-size: 1.8rem;
    }

    .description {
      color: #64748b;
      line-height: 1.6;
      font-size: 0.94rem;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 650;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .hint {
      color: #8b5cf6;
      font-size: 0.78rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #dbe2ea;
      border-radius: 9px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
      background: #f8fafc;
    }

    input:focus {
      border-color: #8b5cf6;
      background: white;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    input:invalid:not(:placeholder-shown) {
      border-color: #ef4444;
    }

    input:valid:not(:placeholder-shown) {
      border-color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #6366f1, #9333ea);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(99, 102, 241, 0.25);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #6366f1;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 0.78rem;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main>
    <span class="tag">WEB PROGRAMMING • TOPIC 04</span>

    <h1>Form Validation</h1>

    <p class="description">
      Explore HTML5 validation features. Enter the correct information
      in each field to test the built-in form constraints.
    </p>

    <form>
      <div class="field">
        <label for="name">
          Full Name <span class="hint">• Required / Min 3 characters</span>
        </label>
        <input
          type="text"
          id="name"
          name="name"
          required
          minlength="3"
          placeholder="Enter your full name">
      </div>

      <div class="field">
        <label for="sid">
          Student ID <span class="hint">• Exactly 9 digits</span>
        </label>
        <input
          type="text"
          id="sid"
          name="sid"
          required
          pattern="\d{9}"
          placeholder="Example: 202112345"
          title="Please enter exactly 9 digits">
      </div>

      <div class="field">
        <label for="grade">
          Course Score <span class="hint">• Minimum 0 / Maximum 100</span>
        </label>
        <input
          type="number"
          id="grade"
          name="grade"
          min="0"
          max="100"
          placeholder="Enter score (0–100)">
      </div>

      <button type="submit">Submit & Check Validation →</button>
    </form>

    <a class="back" href="index.html">← Return to Homepage</a>

    <p class="footer">HTML5 • Input Constraints • Form Validation</p>
  </main>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 03 | HTML5 Input Types</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #263449;
      padding: 35px 16px;
      max-width: 560px;
      margin: auto;
    }

    main {
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      border-top: 5px solid #0f766e;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.08);
    }

    h1 {
      color: #0f766e;
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 14px;
      background: #f8fafc;
      transition: 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #0f766e;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    input[type="color"] {
      height: 43px;
      padding: 3px;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      color: #0f766e;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      main {
        padding: 22px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Topic 03: HTML5 Input Types</h1>

    <p>
      HTML5 provides different input types to collect user information.
      Each type offers suitable controls and improves the form experience.
    </p>

    <div class="field">
      <label for="t-text">Text Input</label>
      <input type="text" id="t-text" placeholder="Enter your full name">
    </div>

    <div class="field">
      <label for="t-email">Email Address</label>
      <input type="email" id="t-email" placeholder="student@gachon.ac.kr">
    </div>

    <div class="field">
      <label for="t-pwd">Password</label>
      <input type="password" id="t-pwd" placeholder="Enter your password">
    </div>

    <div class="field">
      <label for="t-date">Date of Birth</label>
      <input type="date" id="t-date">
    </div>

    <div class="field">
      <label for="t-color">Choose a Color</label>
      <input type="color" id="t-color" value="#0f766e">
    </div>

    <a class="back" href="index.html">← Back to Index</a>
  </main>
</body>
</html>
